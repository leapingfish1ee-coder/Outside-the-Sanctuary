<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Outside the Sanctuary</title>
  <link rel="stylesheet" href="styles/brand.css?v=20261004b">
  <link rel="stylesheet" href="styles/hud.css?v=20261004b">
</head>
<body class="hud">
  <a class="wiki-link" href="wiki.html">WIKI</a>
  <header class="brand">
    <h1 class="wordmark"><span>Outside the</span> <span>Sanctuary</span></h1>
    <p>圣所之外 · 自动战斗</p>
  </header>

  <section class="player" aria-label="玩家角色">
    <h2 class="folio section-label"><span>角色档案</span><span class="folio__index">CHARACTER</span></h2>
    <div class="player__row"><span class="player__label">角色名</span><span class="player__value">未命名</span></div>
    <div class="player__row player__row--minor"><span class="player__label">职业</span><span class="player__value">未选择</span></div>
    <div class="player__row player__row--minor"><span class="player__label">等级</span><span class="player__value" id="level">1</span></div>
    <div class="player__vitals">
      <div class="player__metric">
        <div class="player__metric-head"><span>生命</span><span id="player-hp-text">180 / 180</span></div>
        <div class="player__bar"><div class="player__fill player__fill--hp" id="player-hp-fill"></div></div>
      </div>
      <div class="player__metric">
        <div class="player__metric-head"><span>经验</span><span id="xp-text">0 / 60</span></div>
        <div class="player__bar"><div class="player__fill" id="xp-fill"></div></div>
      </div>
      <div class="player__state" id="player-state" aria-live="polite">自动战斗中</div>
    </div>
  </section>

  <section class="enemy-stack" aria-label="敌人状态">
    <h2 class="enemy-stack__head folio section-label"><span>当前战场</span><span class="folio__index">WAVE <span id="wave">1</span></span></h2>
    <div class="enemies" id="enemies" aria-live="polite"></div>
  </section>

  <aside class="attributes" id="attributes" aria-label="角色属性">
    <div class="attributes__header"><span class="label">自由点数</span><span class="value" id="points">0</span></div>
    <div class="attribute-row attr-strength"><span class="name">力量</span><span class="value" id="stat-strength">1</span><div class="attribute-row__actions"><button class="plus p1" data-stat="力量" data-amount="1" hidden>+1</button><button class="plus p5" data-stat="力量" data-amount="5" hidden>+5</button><button class="plus p10" data-stat="力量" data-amount="10" hidden>+10</button><button class="plus p50" data-stat="力量" data-amount="50" hidden>+50</button><button class="plus p100" data-stat="力量" data-amount="100" hidden>+100</button></div></div>
    <div class="attribute-row attr-agility"><span class="name">敏捷</span><span class="value" id="stat-agility">1</span><div class="attribute-row__actions"><button class="plus p1" data-stat="敏捷" data-amount="1" hidden>+1</button><button class="plus p5" data-stat="敏捷" data-amount="5" hidden>+5</button><button class="plus p10" data-stat="敏捷" data-amount="10" hidden>+10</button><button class="plus p50" data-stat="敏捷" data-amount="50" hidden>+50</button><button class="plus p100" data-stat="敏捷" data-amount="100" hidden>+100</button></div></div>
    <div class="attribute-row attr-intellect"><span class="name">智力</span><span class="value" id="stat-intellect">1</span><div class="attribute-row__actions"><button class="plus p1" data-stat="智力" data-amount="1" hidden>+1</button><button class="plus p5" data-stat="智力" data-amount="5" hidden>+5</button><button class="plus p10" data-stat="智力" data-amount="10" hidden>+10</button><button class="plus p50" data-stat="智力" data-amount="50" hidden>+50</button><button class="plus p100" data-stat="智力" data-amount="100" hidden>+100</button></div></div>
    <div class="attribute-row attr-will"><span class="name">意志</span><span class="value" id="stat-will">1</span><div class="attribute-row__actions"><button class="plus p1" data-stat="意志" data-amount="1" hidden>+1</button><button class="plus p5" data-stat="意志" data-amount="5" hidden>+5</button><button class="plus p10" data-stat="意志" data-amount="10" hidden>+10</button><button class="plus p50" data-stat="意志" data-amount="50" hidden>+50</button><button class="plus p100" data-stat="意志" data-amount="100" hidden>+100</button></div></div>
    <div class="attribute-row attr-spirit"><span class="name">灵知</span><span class="value" id="stat-spirit">1</span><div class="attribute-row__actions"><button class="plus p1" data-stat="灵知" data-amount="1" hidden>+1</button><button class="plus p5" data-stat="灵知" data-amount="5" hidden>+5</button><button class="plus p10" data-stat="灵知" data-amount="10" hidden>+10</button><button class="plus p50" data-stat="灵知" data-amount="50" hidden>+50</button><button class="plus p100" data-stat="灵知" data-amount="100" hidden>+100</button></div></div>
    <div class="attribute-row attr-faith"><span class="name">信仰</span><span class="value" id="stat-faith">1</span><div class="attribute-row__actions"><button class="plus p1" data-stat="信仰" data-amount="1" hidden>+1</button><button class="plus p5" data-stat="信仰" data-amount="5" hidden>+5</button><button class="plus p10" data-stat="信仰" data-amount="10" hidden>+10</button><button class="plus p50" data-stat="信仰" data-amount="50" hidden>+50</button><button class="plus p100" data-stat="信仰" data-amount="100" hidden>+100</button></div></div>
  </aside>

  <nav class="skillbar" id="skills" tabindex="0" aria-label="自动技能栏"></nav>

  <aside class="combat-log" aria-label="战斗日志">
    <div class="combat-log__head folio section-label"><span>战斗日志</span><span>自动记录</span></div>
    <div class="log" id="log" aria-live="polite"></div>
  </aside>

  <script src="game.js?v=aa388a1"></script>
</body>
</html>
