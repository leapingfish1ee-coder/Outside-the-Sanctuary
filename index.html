<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Outside the Sanctuary</title>
  <style>
    :root{--ink:#171714;--muted:#85837d;--line:#d8d6ce;--paper:#f4f1e9;--red:#9b3d32;--gold:#a7792f}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{background:var(--paper);color:var(--ink);font-family:"Songti SC",SimSun,"宋体",serif}
    button{font:inherit}.page{display:grid;grid-template-columns:300px minmax(440px,1fr) 330px;min-height:100vh}
    .panel{padding:38px 32px;border-right:1px solid var(--line)}
    .brand h1{margin:0;font-size:27px;font-weight:400}.brand p,.eyebrow{margin:7px 0 0;color:var(--muted);font-family:Arial,sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
    .player-card{margin-top:54px}.level-line{display:flex;align-items:flex-end;justify-content:space-between}.level{font-size:48px}.level small{font-size:13px;color:var(--muted)}
    .name{font-size:20px}.bar{position:relative;height:8px;margin-top:10px;border:1px solid var(--ink);overflow:hidden}.fill{height:100%;transition:width .25s}.hp-fill{background:var(--red)}.xp-fill{background:var(--gold)}
    .bar-label{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font:11px Arial,sans-serif}.state{margin-top:20px;padding:12px;border:1px solid var(--line);text-align:center;font-size:13px;letter-spacing:.08em}
    .state.dead{border-color:var(--red);color:var(--red)}.stats{margin-top:44px}.stats-head{display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--ink)}
    .points{color:var(--gold)}.stat{display:grid;grid-template-columns:1fr 44px 36px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.stat-value{font:18px Arial,sans-serif}
    .add{width:31px;height:27px;border:1px solid var(--ink);background:transparent;cursor:pointer}.add:disabled{color:#aaa;border-color:#ccc;cursor:not-allowed}.add:not(:disabled):hover{background:var(--ink);color:var(--paper)}
    .wiki-link{display:inline-block;margin-top:34px;color:var(--ink);font-size:12px;text-decoration:none;border-bottom:1px solid}
    .battlefield{position:relative;padding:38px 5vw 150px}.battle-head{display:flex;justify-content:space-between;align-items:end}.battle-head h2{margin:0;font-size:38px;font-weight:400}.wave{font:12px Arial,sans-serif;color:var(--muted)}
    .enemies{display:grid;gap:18px;margin-top:54px}.enemy{padding:20px;border:1px solid var(--line);background:rgba(255,255,255,.28);transition:opacity .2s}.enemy.dead{opacity:.35}.enemy-meta{display:flex;justify-content:space-between;align-items:baseline}.enemy-name{font-size:18px}.enemy-status{font:11px Arial,sans-serif;color:var(--muted)}.enemy .bar{height:6px}.enemy-hit{margin-top:11px;color:var(--muted);font-size:11px}
    .skills{position:absolute;left:5vw;right:5vw;bottom:38px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.skill{position:relative;min-height:78px;padding:13px;border:1px solid var(--ink);overflow:hidden;background:transparent}.skill-name{position:relative;z-index:2;font-size:16px}.skill-detail{position:relative;z-index:2;margin-top:7px;color:var(--muted);font:10px Arial,sans-serif}.cooldown{position:absolute;inset:auto 0 0;background:rgba(23,23,20,.12);transition:height .1s linear}.cd-text{position:absolute;right:8px;top:8px;font:12px Arial,sans-serif}
    .journal{padding:38px 28px;border-left:1px solid var(--line);background:#eeebe2}.journal h2{margin:0 0 25px;font-size:20px;font-weight:400}.log{display:flex;flex-direction:column;gap:0}.entry{padding:11px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.6}.entry time{display:block;color:var(--muted);font:9px Arial,sans-serif}.entry.good{color:#6d5725}.entry.bad{color:var(--red)}
    @media(max-width:980px){.page{grid-template-columns:250px 1fr}.journal{display:none}.panel{padding:25px 22px}.battlefield{padding:25px 30px 145px}.skills{left:30px;right:30px}}
    @media(max-width:680px){.page{display:block}.panel{border-right:0;border-bottom:1px solid var(--line)}.player-card{margin-top:28px}.stats{margin-top:25px}.battlefield{min-height:700px;padding:28px 20px 145px}.battle-head h2{font-size:30px}.enemies{margin-top:30px}.skills{position:relative;left:auto;right:auto;bottom:auto;margin-top:35px;grid-template-columns:1fr}.journal{display:block;border-left:0}.page{min-width:0}}
  </style>
</head>
<body>
  <main class="page">
    <aside class="panel">
      <header class="brand"><h1>Outside the Sanctuary</h1><p>Autonomous expedition</p></header>
      <section class="player-card" aria-label="玩家状态">
        <div class="level-line"><div><span class="eyebrow">漂泊者</span><div class="name">未命名旅人</div></div><div class="level"><small>LV.</small> <span id="level">1</span></div></div>
        <div class="bar" aria-label="生命值"><div class="fill hp-fill" id="player-hp-fill"></div></div><div class="bar-label"><span>生命</span><span id="player-hp-text"></span></div>
        <div class="bar" aria-label="经验值"><div class="fill xp-fill" id="xp-fill"></div></div><div class="bar-label"><span>经验</span><span id="xp-text"></span></div>
        <div class="state" id="player-state">自动战斗中</div>
      </section>
      <section class="stats" aria-label="角色属性">
        <div class="stats-head"><span>基础属性</span><span class="points">自由点数 <b id="points">0</b></span></div>
        <div id="stats-list"></div>
        <p class="eyebrow">属性暂不影响战斗数值</p>
      </section>
      <a class="wiki-link" href="wiki.html">查阅 WIKI →</a>
    </aside>

    <section class="battlefield">
      <header class="battle-head"><div><p class="eyebrow">荒野 · 自动交战区</p><h2>战场</h2></div><span class="wave">WAVE <b id="wave">1</b></span></header>
      <div class="enemies" id="enemies" aria-live="polite"></div>
      <div class="skills" id="skills" aria-label="自动技能栏"></div>
    </section>

    <aside class="journal"><p class="eyebrow">实时记录</p><h2>战斗日志</h2><div class="log" id="log" aria-live="polite"></div></aside>
  </main>
  <script src="game.js"></script>
</body>
</html>
